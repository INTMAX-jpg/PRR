[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "prr-paper-materials"
version = "0.1.0"
description = "PRR behavior and final rebuttal probability-readout materials"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.2", "matplotlib>=3.8"]
[tool.setuptools.packages.find]
where = ["src"]
